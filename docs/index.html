<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Green Lab student registration and attendance system">
    <title>Green Lab | Attendance</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <main class="container">
        <section id="mainActionCard" class="registration-card action-card">
            <div class="header">
                <h1 id="pageTitle">Green Lab</h1>
                <p id="pageSubtitle">Student Registration</p>
            </div>

            <div id="registrationArea">
                <form id="registrationForm" autocomplete="off">
                    <div class="form-group">
                        <label for="studentId">Student ID</label>
                        <input id="studentId" type="text" placeholder="Enter your student ID" required>
                    </div>

                    <div class="form-group">
                        <label for="name">Name</label>
                        <input id="name" type="text" placeholder="Enter your full name" autocomplete="name" required>
                    </div>

                    <button id="registerButton" type="submit">Register</button>
                </form>
            </div>

            <div id="attendanceActionArea" hidden>
                <p id="attendanceStatus" class="attendance-status"></p>
                <button id="attendanceActionButton" type="button"></button>
            </div>

            <p id="message" role="status" aria-live="polite"></p>
        </section>

        <section class="qr-panel">
            <div class="qr-card">
                <h2>Entry QR</h2>
                <div id="entryQr" class="qrcode" aria-label="Green Lab entry QR code"></div>
                <p>Scan this QR to mark entry.</p>
            </div>

            <div class="qr-card">
                <h2>Exit QR</h2>
                <div id="exitQr" class="qrcode" aria-label="Green Lab exit QR code"></div>
                <p>Scan this QR to mark exit.</p>
            </div>
        </section>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
    <script src="js/config.js"></script>
    <script src="js/worker.js"></script>
    <script src="js/app.js"></script>
    <script>
        const siteUrl = "https://rakhuljm.github.io/green-lab-attendance/";

        new QRCode(document.getElementById("entryQr"), {
            text: siteUrl + "entry.html",
            width: 220,
            height: 220,
            correctLevel: QRCode.CorrectLevel.M
        });

        new QRCode(document.getElementById("exitQr"), {
            text: siteUrl + "exit.html",
            width: 220,
            height: 220,
            correctLevel: QRCode.CorrectLevel.M
        });
    </script>
</body>
</html>
