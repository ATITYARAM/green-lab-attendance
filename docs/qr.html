<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Green Lab student attendance and lab time tracking system.">
  <title>Green Lab | Attendance QR</title>
  <link rel="stylesheet" href="./css/style.css">
</head>
<body>
  <main class="qr-print-page">
    <section class="qr-mobile-message" aria-live="polite">
      <h1>QR Code Not Available on Mobile</h1>
      <p>The Green Lab attendance QR code is available only on desktop browsers for printing and display.</p>
    </section>

    <section class="qr-print-card">
      <h1>Green Lab</h1>
      <p>Scan this QR code to record Green Lab attendance.</p>

      <img
        class="qr-print-image"
        src="https://quickchart.io/qr?text=https%3A%2F%2Frakhuljm.github.io%2Fgreen-lab-attendance%2Fattendance.html%3Faction%3Dscan&format=svg&size=500&margin=4&ecLevel=Q"
        alt="Green Lab Attendance QR Code"
      >

      <p class="url">https://rakhuljm.github.io/green-lab-attendance/attendance.html?action=scan</p>

      <button class="print-button" type="button" onclick="window.print()">Print QR Code</button>
    </section>
  </main>

  <style>
    .qr-mobile-message {
      display: none;
      width: min(100% - 32px, 720px);
      margin: 0 auto;
      padding: 48px 24px;
      text-align: center;
    }

    .qr-mobile-message h1 {
      margin: 0 0 10px;
      color: #1f6f43;
    }

    .qr-mobile-message p {
      margin: 0;
      color: #4b5563;
      line-height: 1.6;
    }

    @media (max-width: 768px) {
      .qr-print-card { display: none; }
      .qr-mobile-message { display: block; }
    }

    @media print {
      .qr-mobile-message { display: none; }
      .qr-print-card { display: block; }
    }
  </style>
</body>
</html>
