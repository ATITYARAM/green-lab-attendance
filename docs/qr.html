<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Green Lab | Attendance QR</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            min-height: 100vh;
            margin: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #f4f7f5;
        }

        .card {
            width: min(90vw, 620px);
            padding: 40px;
            background: white;
            text-align: center;
            border-radius: 18px;
            box-shadow: 0 12px 35px rgba(0, 0, 0, 0.08);
        }

        h1 {
            margin-bottom: 8px;
            color: #1f6f43;
        }

        p {
            color: #4b5563;
            line-height: 1.6;
        }

        .qr {
            width: min(85vw, 460px);
            height: min(85vw, 460px);
            margin: 24px auto;
            display: block;
        }

        .url {
            word-break: break-all;
            font-size: 13px;
            color: #6b7280;
        }

        .print-button {
            margin-top: 20px;
            padding: 12px 22px;
            border: 0;
            border-radius: 8px;
            background: #1f6f43;
            color: white;
            font-size: 15px;
            cursor: pointer;
        }

        @media print {
            body {
                background: white;
            }

            .card {
                width: 100%;
                box-shadow: none;
                padding: 20px;
            }

            .print-button {
                display: none;
            }
        }
    </style>
</head>

<body>
    <main class="card">
        <h1>Green Lab</h1>
        <p>Scan this QR code to record Green Lab attendance.</p>

        <img
            class="qr"
            src="https://quickchart.io/qr?text=https%3A%2F%2Frakhuljm.github.io%2Fgreen-lab-attendance%2Fattendance.html%3Faction%3Dscan&format=svg&size=500&margin=4&ecLevel=Q"
            alt="Green Lab Attendance QR Code"
        >

        <p class="url">
            https://rakhuljm.github.io/green-lab-attendance/attendance.html?action=scan
        </p>

        <button class="print-button" onclick="window.print()">
            Print QR Code
        </button>
    </main>
</body>
</html>
