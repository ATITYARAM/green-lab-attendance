<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Green Lab attendance tracker">
    <title>Green Lab | Attendance</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <main class="container">
        <section class="registration-card">
            <div class="header">
                <h1>Green Lab</h1>
                <p>Attendance</p>
            </div>

            <div id="studentInfo">Loading student...</div>
            <div id="status" class="attendance-status">Checking attendance...</div>
            <div id="timer" class="timer">00:00:00</div>

            <button id="toggleButton" type="button">Mark Entry</button>
            <p id="message" role="status" aria-live="polite"></p>

            <div class="history-section">
                <h2>Recent Attendance</h2>
                <div id="history">Loading history...</div>
            </div>
        </section>

        <section class="qr-panel">
            <div class="qr-card">
                <h2>Entry QR</h2>
                <div id="entryQr" class="qrcode"></div>
                <p>Scan to mark entry.</p>
            </div>
            <div class="qr-card">
                <h2>Exit QR</h2>
                <div id="exitQr" class="qrcode"></div>
                <p>Scan to mark exit.</p>
            </div>
        </section>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
    <script src="js/config.js"></script>
    <script src="js/worker.js"></script>
    <script src="js/attendance.js"></script>
    <script>
        const siteUrl = "https://rakhuljm.github.io/green-lab-attendance/";

        new QRCode(document.getElementById("entryQr"), {
            text: siteUrl + "entry.html",
            width: 220,
            height: 220,
            correctLevel: QRCode.CorrectLevel.M
        });

        new QRCode(document.getElementById("exitQr"), {
            text: siteUrl + "exit.html",
            width: 220,
            height: 220,
            correctLevel: QRCode.CorrectLevel.M
        });
    </script>
    <style>
        @media (max-width: 768px) {
            .qr-panel {
                display: none;
            }
        }
    </style>
</body>
</html>
